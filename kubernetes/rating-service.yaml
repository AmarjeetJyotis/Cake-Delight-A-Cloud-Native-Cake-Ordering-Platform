apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      containers:
        - name: rating-service
          image: docker-rating-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "rating_db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "Amarjeet@9798"

---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: cake-delight
spec:
  selector:
    app: rating-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP