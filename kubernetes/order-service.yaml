apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: docker-order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "order_db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "Amarjeet@9798"
            - name: RABBITMQ_URL
              value: "amqp://admin:admin123@rabbitmq:5672"

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cake-delight
spec:
  selector:
    app: order-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP