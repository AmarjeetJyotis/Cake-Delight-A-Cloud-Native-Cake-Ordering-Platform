apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: docker-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: CATALOG_SERVICE
              value: "http://catalog-service:5001"
            - name: ORDER_SERVICE
              value: "http://order-service:5002"
            - name: RATING_SERVICE
              value: "http://rating-service:5003"
            - name: NOTIFICATION_SERVICE
              value: "http://notification-service:5004"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cake-delight
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
  type: NodePort